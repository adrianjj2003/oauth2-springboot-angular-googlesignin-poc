# Pipeline de CI para OKR2 (resource-server) 
name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend + tests + calidad (Maven, resource-server)
        working-directory: ./resource-server
        run: mvn -B clean verify

        
