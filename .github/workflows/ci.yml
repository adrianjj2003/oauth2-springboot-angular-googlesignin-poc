# Pipeline de CI para OKR2 (resource-server) 
name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend + tests + calidad (Maven, resource-server)
        working-directory: ./resource-server
        run: mvn -B clean verify
        
      - name: Build imagen Docker resource-server
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/resource-server:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/resource-server:latest \
            ./resource-server

      - name: Push imagen a GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/resource-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/resource-server:latest


        
