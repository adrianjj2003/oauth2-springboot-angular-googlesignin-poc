name: CD - Build & Push resource-server to GHCR

on:
  push:
    branches: ["develop"]
    paths:
      - "resource-server/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (using GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./resource-server
          file: ./resource-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resource-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/resource-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
