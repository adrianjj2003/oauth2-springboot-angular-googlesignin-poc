name: CD

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-resource-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry (PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build imagen Docker resource-server
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/resource-server:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/resource-server:latest \
            ./resource-server

      - name: Push imagen a GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/resource-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/resource-server:latest

      - name: Escaneo de vulnerabilidades (post-push)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/resource-server:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"



